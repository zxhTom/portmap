# 47 VPS server console. Client domains belong to a separate virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name server.port.zxhtom.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/server-port-zxhtom-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name server.port.zxhtom.store;

    ssl_certificate /etc/letsencrypt/live/server.port.zxhtom.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.port.zxhtom.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($ssl_server_name != $host) { return 421; }

    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:9890;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
