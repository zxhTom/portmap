# Public HTTPS entry for the VPS console. The Go service stays on loopback.
server {
    listen 80;
    listen [::]:80;
    server_name server.port.toms.chat;
    return 308 https://server.port.toms.chat$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name server.port.toms.chat;

    ssl_certificate /etc/nginx/cert/port-toms-chat-temp/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/port-toms-chat-temp/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($ssl_server_name != $host) { return 421; }

    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:9890;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
