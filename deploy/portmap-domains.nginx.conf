# Portmap owns only this DNS namespace. Existing sites remain separate.
# Replace these certificate paths when the wildcard certificate is supplied.
map $http_upgrade $portmap_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.port.toms.chat;

    location / {
        proxy_pass http://127.0.0.1:9881;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.port.toms.chat;

    ssl_certificate /etc/nginx/cert/port-toms-chat-temp/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/port-toms-chat-temp/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # An unrelated TLS name must not be used to reach a bound HTTP hostname.
    if ($ssl_server_name != $host) { return 421; }

    client_max_body_size 0;
    location / {
        proxy_pass http://127.0.0.1:9881;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portmap_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
