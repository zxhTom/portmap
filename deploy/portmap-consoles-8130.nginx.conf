map $http_upgrade $portmap_8130_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name server.port.toms.chat portmap.port.toms.chat tomsportmap.port.toms.chat;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portmap-consoles;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name server.port.toms.chat;
    ssl_certificate /etc/letsencrypt/live/portmap-consoles/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portmap-consoles/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ssl_server_name != $host) { return 421; }
    location / {
        proxy_pass http://127.0.0.1:9890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portmap_8130_connection_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name portmap.port.toms.chat tomsportmap.port.toms.chat;
    ssl_certificate /etc/letsencrypt/live/portmap-consoles/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portmap-consoles/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ssl_server_name != $host) { return 421; }
    location / {
        proxy_pass http://127.0.0.1:9881;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portmap_8130_connection_upgrade;
    }
}
